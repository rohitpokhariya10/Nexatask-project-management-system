services:
  - type: web
    name: countryedu-nexatask-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npm run build --workspace server
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    initialDeployHook: npm run bootstrap:admin --workspace server
    buildFilter:
      paths:
        - server/**
        - package.json
        - package-lock.json
        - tsconfig.base.json
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CLIENT_URL
        sync: false
      - key: BCRYPT_SALT_ROUNDS
        value: '12'
      - key: MAX_FILE_SIZE
        value: '5242880'
      - key: UPLOAD_DIRECTORY
        value: server/uploads
      - key: AUTO_INDEX
        value: 'true'
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
